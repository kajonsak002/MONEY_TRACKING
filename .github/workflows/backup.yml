name: Database Backup

on:
  schedule:
    - cron: "15 17 * * *" # 00:15 Asia/Bangkok
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: money-tracking-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install PostgreSQL client and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          aws --version
          pg_dump --version
      - name: Create encrypted database dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL"
          test -n "$BACKUP_PASSPHRASE"
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-acl --file=backup/money-tracking.dump
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 -in backup/money-tracking.dump -out backup/money-tracking.dump.enc -pass env:BACKUP_PASSPHRASE
          sha256sum backup/money-tracking.dump.enc > backup/money-tracking.dump.enc.sha256
          rm -f backup/money-tracking.dump
      - name: Upload encrypted backup to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          PREFIX="money-tracking/$(date -u +%Y/%m/%d)"
          aws s3 cp backup/money-tracking.dump.enc "s3://${R2_BUCKET}/${PREFIX}/money-tracking.dump.enc" --endpoint-url "$ENDPOINT"
          aws s3 cp backup/money-tracking.dump.enc.sha256 "s3://${R2_BUCKET}/${PREFIX}/money-tracking.dump.enc.sha256" --endpoint-url "$ENDPOINT"
      - name: Verify uploaded object
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          PREFIX="money-tracking/$(date -u +%Y/%m/%d)"
          aws s3api head-object --bucket "$R2_BUCKET" --key "${PREFIX}/money-tracking.dump.enc" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
